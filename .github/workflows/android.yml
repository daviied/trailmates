name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Create Android project
        run: |
          npx cap add android
          cp node_modules/@capacitor/core/dist/capacitor.js public/vendor/
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk TrailMates.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TrailMates-apk
          path: TrailMates.apk
      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: TrailMates Android (latest)
          body: Download TrailMates.apk on your Android phone and open it to install.
          files: TrailMates.apk
          make_latest: true
